name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, so new Go releases are caught

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: ./check.sh
